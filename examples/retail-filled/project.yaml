id: retail
name: Retail sales
values:
  # Application ID of the service principal the pipelines and jobs run as
  run_as: 7f3c2a10-0000-4000-8000-000000000001
  # Group that manages the pipelines and jobs
  engineers: sales-engineers
  # Group that may view the pipelines and jobs
  analysts: sales-analysts
  # Where pipeline failures are mailed
  on_failure: sales-data@example.com
environments:
  dev:
    values:
      # The Databricks workspace URL, https://adb-<id>.<n>.azuredatabricks.net
      host: https://adb-1111111111111111.1.azuredatabricks.net
      # Storage account (ADLS Gen2) that the shop's files land in: its name
      storage_account: retaildev
  prod:
    values:
      # The Databricks workspace URL, https://adb-<id>.<n>.azuredatabricks.net
      host: https://adb-2222222222222222.2.azuredatabricks.net
      # Storage account (ADLS Gen2) that the shop's files land in: its name
      storage_account: retailprod
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - transforms/*.yaml
  - contracts/*.yaml
