apiVersion: ingestron.io/v1
kind: Standard
id: erp
packs: [databricks@2, adf@2] # Databricks first: the first pack names and types the tables; ADF only copies
naming:
  # One catalog per environment, such as erp_dev
  catalog: erp_{{ environment }}
ingest:
  settings:
    adf-copy:
      # the schedule; where it lands is the platform's
      mode: incremental
      watermark_column: modified_at
      every: {frequency: Hour, interval: 1}
      # Start of the first window (UTC): midnight on the day this project was created
      start: 2026-11-06T00:00:00Z
store:
  settings:
    # Each window's file holds the rows changed in it; keep the current version.
    streaming-table: {mode: upsert, sequence_by: modified_at}
