apiVersion: ingestron.io/v1
kind: Flow
id: erp
source: erp
# When a row last changed: each copy reads the rows past it,
# and the tables keep the latest row of each key by it
load: { cursor: modified_at }
sequence: modified_at
tables:
  customers:
    # The source table: its database and schema, database.schema.Customers
    object: erp.dbo.Customers
    contract: erp.customers
  invoices:
    # The source table: its database and schema, database.schema.Invoices
    object: erp.dbo.Invoices
    contract: erp.invoices
    load: { cursor: updated_at }
    sequence: updated_at
