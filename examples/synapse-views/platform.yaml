apiVersion: ingestron.io/v1
kind: Platform
id: azure
principals: # the database user each role is, per environment
  finance-analysts: ${values.finance_analysts}
  data-engineers: ${values.data_engineers}
settings:
  adf-copy: # shared infrastructure, referenced by name
    landing: ${values.landing}
    key_vault: ${values.key_vault}
    integration_runtime: shir-erp
  synapse-view: # the external data source the views read through
    data_source: landing
    data_source_location: ${values.storage}
synapse:
  manage: { grants: true } # views.sql grants SELECT on each view to its roles
