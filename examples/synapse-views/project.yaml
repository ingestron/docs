# ADF copies the ERP's tables into storage, and Synapse serverless SQL shows
# them to reports as views, with a transform as a view too: nothing runs after
# a load, and nothing is stored but the files.
id: sales
environments:
  dev: {}
  prod:
    values:
      landing: abfss://landing@saleslakeprod.dfs.core.windows.net/erp
      storage: abfss://landing@saleslakeprod.dfs.core.windows.net
      key_vault: https://kv-sales-prod.vault.azure.net
      finance_analysts: sales-finance-analysts
      data_engineers: sales-data-engineers
values:
  landing: abfss://landing@saleslakedev.dfs.core.windows.net/erp
  storage: abfss://landing@saleslakedev.dfs.core.windows.net
  key_vault: https://kv-sales-dev.vault.azure.net
  finance_analysts: sales-finance-analysts-dev
  data_engineers: sales-data-engineers-dev
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - transforms/*.yaml
  - contracts/*.yaml
