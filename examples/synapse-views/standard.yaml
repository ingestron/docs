apiVersion: ingestron.io/v1
kind: Standard
id: sales
packs: [synapse@2] # the workspace pipelines copy; serverless SQL shows the views
layers:
  - name: bronze # every row as it arrived; its checks only count
    does: raw
    access: { roles: [{ role: data-engineers }] } # beside the contracts' roles
  - { name: silver, does: [check] }
  - { name: gold, does: [check] }
store:
  default: synapse-view # each table is a view over its landed files
ingest:
  default: synapse-copy # the workspace pipelines copy each table
  settings:
    synapse-copy:
      layout: snapshot # one file per table, replaced by each load
      every: { frequency: Hour, interval: 24 }
      start: 2026-10-01T00:00:00Z
