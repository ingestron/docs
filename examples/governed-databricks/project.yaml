# ADF copies a web shop's customers and orders from Azure SQL, and Databricks
# keeps the tables. Each table says who may read it, sensitive columns are
# masked, and each reader sees only their region's rows.
id: shop
environments:
  dev: {}
  prod:
    values:
      landing: abfss://landing@shopprod.dfs.core.windows.net
      key_vault: https://kv-shop-prod.vault.azure.net
      host: https://adb-2222222222222222.2.azuredatabricks.net
      functions: prod_governance.functions
      marketing: shop-marketing-analysts
      finance: shop-finance-analysts
      engineers: shop-data-engineers
values:
  landing: abfss://landing@shopdev.dfs.core.windows.net
  key_vault: https://kv-shop-dev.vault.azure.net
  host: https://adb-1111111111111111.1.azuredatabricks.net
  functions: dev_governance.functions # the schema that holds the mask and filter functions
  marketing: shop-marketing-analysts-dev # the group each role is, per environment
  finance: shop-finance-analysts-dev
  engineers: shop-data-engineers-dev
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - transforms/*.yaml
  - contracts/*.yaml
