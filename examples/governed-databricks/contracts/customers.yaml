apiVersion: v3.1.0
kind: DataContract
id: shop.customers
version: 1.0.0
status: active
schema:
  - name: customers
    logicalType: object
    description: Everyone who has bought from the web shop.
    properties:
      - { name: id, logicalType: integer, primaryKey: true, classification: internal }
      - { name: email, logicalType: string, required: true, classification: confidential }
      - { name: phone, logicalType: string, classification: restricted }
      - { name: region, logicalType: string, classification: internal, tags: [region] }
roles:
  - role: marketing-analysts
    access: read
    description: Campaign reporting by region
