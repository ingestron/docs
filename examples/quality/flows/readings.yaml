apiVersion: ingestron.io/v1
kind: Flow
id: readings
source: ${values.source}
tables:
  readings:
    object: readings
    contract: iot.readings
    expectations:
      # SQL that Databricks, DuckDB and Synapse each read the same way
      - { name: plausible_temperature, check: temperature BETWEEN -60 AND 80, action: fail }
