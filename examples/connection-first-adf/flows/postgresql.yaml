apiVersion: ingestron.io/v1
kind: Flow
id: postgresql
source: postgresql
ingest:
  uses: adf-table # the route's ingest method; a table may choose another
  with:
    resource_names:
      pipeline: pl_${values.resource_prefix}_orders
      trigger: tr_${values.resource_prefix}_orders
      copy_activity: copy_orders
tables:
  postgresql_records:
    # The source object: schema.table
    object: sales.orders
    contract: records
