# PostgreSQL: ADF ingestion into Databricks. README.md lists what to fill in.
id: sales
values:
  # The prefix of the ADF pipeline and trigger names, set in flows/postgresql.yaml
  resource_prefix: sales
environments:
  dev:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: syntheticlakedev
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: synthetic-vault-dev
  prod:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: syntheticlakeprod
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: synthetic-vault-prod
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - contracts/*.yaml
