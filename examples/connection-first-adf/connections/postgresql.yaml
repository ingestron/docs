apiVersion: ingestron.io/v1
kind: Connection
id: postgresql
connector: postgresql
connectivity: private # reached only through a self-hosted integration runtime or a private network
settings:
  # Database host name or endpoint as reached by the runtime
  server: source.example.test
  # Database to read
  database: sales
  # Account used to read the source
  user: reader
  # Key Vault secret holding the account password
  password: ${secret:sales-postgresql-password}
