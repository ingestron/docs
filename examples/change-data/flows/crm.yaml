apiVersion: ingestron.io/v1
kind: Flow
id: crm
source: crm
ingest:
  with: { format: json }
sequence: changed_at # the newest change to a key wins
tables:
  accounts:
    object: accounts
    contract: crm.accounts
    # Only the current version of each account.
    history: latest
    load: { deletes: { when: "operation = 'DELETE'" } }
    store:
      with: { except_columns: [operation] }
  contacts:
    object: contacts
    contract: crm.contacts
    # Every version, with __START_AT and __END_AT.
    history: full
    store:
      with: { except_columns: [operation] }
