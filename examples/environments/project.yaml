# One project, three environments. Values differ per environment; the
# platform reads them, and names follow the environment.
id: finance
name: Finance ledger
values:
  host: https://adb-1000000000000001.1.azuredatabricks.net
  landing_catalog: dev_landing
  # Built from another value: each environment changes only the catalog.
  landing: /Volumes/${values.landing_catalog}/finance/files
environments:
  dev: {}
  test:
    values:
      landing_catalog: test_landing
  prod:
    values:
      host: https://adb-2000000000000002.2.azuredatabricks.net
      landing_catalog: prod_landing
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - contracts/*.yaml
