apiVersion: ingestron.io/v1
kind: Platform
id: azure
settings:
  adf-copy: # shared infrastructure, referenced by name
    landing: ${values.landing}
    key_vault: ${values.key_vault}
    integration_runtime: AutoResolveIntegrationRuntime
    after_copy: # the DuckDB job, started after each schedule's copies
      job: ${values.duckdb_job}
  duckdb-table:
    published: ${values.published}
accept: # warnings the platform team has looked at, and why it lives with them
  - code: NOT_APPLIED
    about: { feature: grants }
    reason: DuckDB has no access control. Who may read the published files is set on the storage account.
