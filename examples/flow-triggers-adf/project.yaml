# An ERP that only a self-hosted integration runtime reaches. The factory lands
# a snapshot of each table on the flow's own triggers.
id: erp
environments:
  dev:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: erplakedev
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: kv-erp-dev
  prod:
    values:
      # Storage account (ADLS Gen2) that the landing folder is in: its name
      storage_account: erplakeprod
      # Key Vault that holds the source's secrets: its name, not its URL
      key_vault: kv-erp-prod
imports:
  - standard.yaml
  - platform.yaml
  - connections/*.yaml
  - flows/*.yaml
  - contracts/*.yaml
