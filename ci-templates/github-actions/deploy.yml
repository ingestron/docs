# Deploys the committed build/ folder: checks it, builds the Data Factory
# template once, then deploys the same files to dev, test and prod in turn.
# Copy this file and deploy-environment.yml to .github/workflows/ in your
# definitions repository, and delete the steps of each platform your project
# does not use.
#
# Set up once, as https://docs.ingestron.io/docs/how-to/deploy-through-environments
# explains:
# - GitHub environments named dev, test and prod. Give test and prod required
#   reviewers, and let only the main branch deploy to prod. Required reviewers
#   on a private repository need GitHub Enterprise; without them, test and
#   prod deploy after dev with no approval.
# - In each environment, the variables deploy-environment.yml reads.
# - The repository variable ADF_DEV_FACTORY_ID: the dev factory's resource ID,
#   which names the template's resources. Nothing is deployed with it.
# Each action is pinned to a commit, with its version beside it, and Ingestron
# to an exact version: change them when you upgrade.
name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g ingestron@2.4.0
      - run: ingestron check

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Data Factory: Microsoft's export validates the factory, then writes the
      # ARM template and the pre- and post-deployment script to arm/. It
      # downloads its build tool from adf.azure.com.
      - name: "Data Factory: build the template"
        env:
          ADF_DEV_FACTORY_ID: ${{ vars.ADF_DEV_FACTORY_ID }}
        run: |
          npm install --prefix "$RUNNER_TEMP/adf" @microsoft/azure-data-factory-utilities@1.0.3
          adf="$RUNNER_TEMP/adf/node_modules/@microsoft/azure-data-factory-utilities/lib/index"
          node "$adf" export build/adf/factory "$ADF_DEV_FACTORY_ID" arm
      # Every environment deploys these files, so prod gets the bytes dev got.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy
          path: |
            arm/
            build/
          if-no-files-found: error

  dev:
    permissions:
      contents: read
      id-token: write
    needs: build
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: dev
    secrets: inherit

  test:
    permissions:
      contents: read
      id-token: write
    needs: dev
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: test
    secrets: inherit

  prod:
    permissions:
      contents: read
      id-token: write
    needs: test
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: prod
    secrets: inherit
