# Fails the build when the committed build/ folder is not what the definitions
# generate today. Copy to .github/workflows/ in your definitions repository.
# Each action is pinned to a commit, with its version beside it. Ingestron is
# pinned to an exact version: change it when you upgrade, as
# https://docs.ingestron.io/docs/how-to/upgrade#choose-the-version-you-run says.
name: ingestron check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm install -g ingestron@2.4.0
      - run: ingestron check
