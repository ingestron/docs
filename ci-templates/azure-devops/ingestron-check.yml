# Fails the build when the committed build/ folder is not what the definitions
# generate today. Add as a pipeline in your definitions repository.
trigger:
  branches:
    include: [main]
pr:
  branches:
    include: ["*"]
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - task: UseNode@1
    inputs:
      version: 22.x
  # An exact version: change it when you upgrade, as
  # https://docs.ingestron.io/docs/how-to/upgrade#choose-the-version-you-run says.
  - script: npm install -g ingestron@2.3.0
    displayName: Install Ingestron
  - script: ingestron check
    displayName: ingestron check
